services:
  # 🛡️ Secure Docker Socket Proxy (Blocks host access, limits API surface)
  # NOTE: EXEC dropped to 0 — piper-controller/manager don't need to exec into
  # arbitrary containers via the Docker API. Flip back to 1 only if something breaks
  # and you've confirmed it actually needs exec.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: piper-docker-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - EXEC=0
      - IMAGES=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=1
      - AUTH=1
      - NETWORKS=1
      - VOLUMES=1
      - BUILD=0
      - SERVICES=0
      - TASKS=0
      - SECRETS=0
      - CONFIGS=0
      - NODES=0
      - SWARM=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - piper-network

  db:
    image: postgres:15-alpine
    container_name: piper-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piper_admin -d piper_data"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=piper_admin
      - POSTGRES_PASSWORD=31986ad2ed5a83aab0df5be7
      - POSTGRES_DB=piper_data
    volumes:
      - ./piper_db_data:/var/lib/postgresql/data
    networks:
      piper-network:
        aliases:
          - db

  redis-broker:
    image: redis:7-alpine
    container_name: piper-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      piper-network:
        aliases:
          - redis-broker

  watchtower:
    image: containrrr/watchtower
    container_name: piper-watchtower
    restart: always
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - DOCKER_API_VERSION=1.41
    command: --label-enable --interval 300 --cleanup
    networks:
      - piper-network

  piper-manager:
    image: ghcr.io/philz-dev/piper-manager:v1
    container_name: piper-engine-manager
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - DATABASE_URL=postgresql://piper_admin:31986ad2ed5a83aab0df5be7@db:5432/piper_data
      - MASTER_PASSWORD=6d5e0def040216034a7ca854638ad495
      - PYTHONPATH=/app
      - DOCKER_HOST=tcp://docker-proxy:2375
    volumes:
      - ./.env:/app/.env
      - piper_storage:/app/piper_storage
      - .:/app
    networks:
      - piper-network

  piper-controller:
    image: ghcr.io/philz-dev/piper-controller:v1
    container_name: piper-engine-controller
    restart: always
    entrypoint: ["python", "/app/controller/watcher.py"]
    depends_on:
      redis-broker:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    ports:
      - "8001:8001"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - DATABASE_URL=postgresql://piper_admin:31986ad2ed5a83aab0df5be7@db:5432/piper_data
      - MASTER_PASSWORD=6d5e0def040216034a7ca854638ad495
      - PYTHONPATH=/app/controller
      - HOST_PROJECT_PATH=C:/Users/User/Desktop/Automation/automation_engine
      - PYTHONUNBUFFERED=1
      - DOCKER_HOST=tcp://docker-proxy:2375
      - INSTALL_TOKEN=456502f536a51af469fd489efad6d908f2766489fdc5c1bf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.env:/app/.env
      - piper_storage:/app/piper_storage
      - .:/app
      - ./templates:/app/templates
      - ./.piper_config:/app/.piper_config
    networks:
      - piper-network

  piper-runner-python:
    image: ghcr.io/philz-dev/piper-python_runner:v1
    container_name: piper-runner-python-live
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ${HOST_PROJECT_PATH}:/app
    networks:
      - piper-network
    entrypoint: ["tail", "-f", "/dev/null"]

  piper-runner-node:
    image: ghcr.io/philz-dev/piper-javascript_runner:v1
    container_name: piper-runner-node-live
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ${HOST_PROJECT_PATH}:/app
    networks:
      - piper-network
    entrypoint: ["tail", "-f", "/dev/null"]

  nginx:
    image: nginx:alpine
    container_name: piper-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.piper_internal/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/webroot:/var/www/certbot
    networks:
      - piper-network
    depends_on:
      - piper-servers

  certbot:
    image: certbot/certbot
    container_name: piper-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - piper-network

  piper-frontend:
    image: ghcr.io/philz-dev/piper-frontend:latest
    container_name: piper-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://piper-engine-servers:8099
      - INSTALL_TOKEN=456502f536a51af469fd489efad6d908f2766489fdc5c1bf
      - NEXT_PUBLIC_ENGINE_MODE=local
    networks:
      - piper-network
    depends_on:
      - piper-servers

  piper-servers:
    image: ghcr.io/philz-dev/piper-servers:v1
    container_name: piper-engine-servers
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["python", "/app/servers/main.py"]
    ports:
      - "8099:8099"
      - "50000-50050:50000-50050/udp"
      - "50000-50011:50000-50011/tcp"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://piper_admin:31986ad2ed5a83aab0df5be7@db:5432/piper_data
      - MASTER_PASSWORD=6d5e0def040216034a7ca854638ad495
      - PYTHONPATH=/app
      - DOCKER_HOST=tcp://docker-proxy:2375
      - ENGINE_MODE=local
      - AIOICE_SKIP_INTERFACES=eth0,docker0
      - USER_ID=1
      - PIPER_API_KEY=456502f536a51af469fd489efad6d908f2766489fdc5c1bf
      - INSTALL_TOKEN=456502f536a51af469fd489efad6d908f2766489fdc5c1bf
      - HOST_PROJECT_PATH=C:/Users/User/Desktop/Automation/automation_engine
    volumes:
      - ./.env:/app/.env
      - piper_storage:/app/piper_storage
      - .:/app
    networks:
      - piper-network
    command: python -m servers.main

  piper-services:
    image: ghcr.io/philz-dev/piper-services:v1
    container_name: piper-engine-services
    restart: always
    entrypoint: ["python", "/app/services/main.py"]
    ports:
      - "8003:8003"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - DATABASE_URL=postgresql://piper_admin:31986ad2ed5a83aab0df5be7@db:5432/piper_data
      - MASTER_PASSWORD=6d5e0def040216034a7ca854638ad495
      - PYTHONPATH=/app
    volumes:
      - ./.env:/app/.env
      - piper_storage:/app/piper_storage
      - ./.piper_config:/app/.piper_config
    networks:
      - piper-network
    command: python -m services.main

networks:
  piper-network:
    name: piper-network

volumes:
  piper_storage:
    name: piper_storage
