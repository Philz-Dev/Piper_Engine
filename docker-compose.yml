services:
  # 1. Your Engine (The "Brain")
  piper-engine:
    image: ghcr.io/philz-dev/piper-engine:latest
    container_name: piper_core
    depends_on:
      - piper-db  # Ensures the DB starts before the engine
    environment:
      - DATABASE_URL=postgresql://user:pass@piper-db:5432/context_db
      - MASTER_PASSWORD=${MASTER_PASSWORD}
    volumes:
      - ./templates:/app/templates
    restart: always

  # 2. The Client's Database (The "Memory")
  piper-db:
    image: postgres:15-alpine
    container_name: piper_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=context_db
    volumes:
      - piper_data:/var/lib/postgresql/data # Persists data even if container stops
    restart: always

  # 3. The Auto-Updater
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 piper_core

volumes:
  piper_data: # This creates a permanent storage space on the client's VPS