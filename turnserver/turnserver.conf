# turnserver.conf
realm=piper.com
server-name=piper-turn
listening-port=3478
tls-listening-port=5349

# Important: This MUST be your public IP
external-ip=<YOUR_PUBLIC_IP>

# Relay port range (must match what is opened in your firewall)
min-port=49152
max-port=49512

# Use long-term credentials
user=piperuser:piperpassword
fingerprint
lt-cred-mech
log-file=/var/log/turnserver.log