[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stretis-sdk"
version = "0.2.5"
description = "Python SDK for indie automation platforms: list app/action nodes for your picker UI, render their input forms, and turn filled forms into ready-to-fire API requests."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "httpx",
    "tenacity",
    "cryptography"
]

[tool.setuptools]
# package-dir remaps the ON-DISK folder name (piper_sdk/ — matches the
# monorepo's own human-readable layout, sdks/python/piper_sdk/) to the
# INSTALLED/IMPORTED package name (stretis). Without this, the package
# would install as `piper_sdk` and `from stretis import PiperSDK` would
# fail — this mapping is what makes the two names independent.
#
# "stretis" ships its own __init__.py here (re-exporting PiperSDK etc.),
# which makes it a REGULAR package once stretis-sdk is installed — NOT
# a PEP 420 namespace package like stretis-schemas' bare `stretis/` dir.
# This is intentional and still compatible: Python resolves each dotted
# segment of an import independently, so `stretis.piper_schema` (a
# namespace subpackage, contributed by a completely separate distribution
# with no top-level __init__.py of its own) still resolves correctly
# nested inside this regular `stretis` package. Verified by actually
# installing both together — see the test notes in this repo, not just
# asserted here.
package-dir = { "stretis" = "piper_sdk" }
packages = ["stretis"]

[project.urls]
Homepage = "https://github.com/YOUR_GH_ORG/universal_api_registry"