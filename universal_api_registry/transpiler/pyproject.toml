[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stretis-transpiler"
version = "0.2.4"
description = "Turns a public OpenAPI/Discovery/GraphQL spec into the stretis schema DSL, on demand, locally — no bundled catalog, no redistribution of vendor specs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
# Only ONE package in the stretis family should ever register this name —
# console_scripts entries collide silently across packages (last install
# wins, no error), which is exactly the risk this name was chosen to avoid
# in the first place (see cli.py's module docstring history). If a future
# stretis-sdk or other stretis-* package wants CLI commands, add them as
# more subparsers in THIS package's cli.py, not a second "stretis" entry
# point elsewhere.
stretis = "stretis.piper_transpiler.cli:main"

[tool.setuptools]
# Same reasoning as stretis-schemas' pyproject.toml: "stretis" ships with
# NO __init__.py from this package (that belongs to stretis-sdk alone —
# see its pyproject.toml comment for why only one package in the family
# may own that file). This package contributes ONLY stretis.transpiler,
# as a namespace subpackage, so it composes with stretis-sdk and
# stretis-schemas being installed alongside it without collision.
package-dir = { "" = "src" }
packages = ["stretis", "stretis.piper_transpiler"]

[tool.setuptools.package-data]
"stretis.piper_transpiler" = ["manifest.json"]

[project.urls]
Homepage = "https://github.com/stretis/universal-api-registry"